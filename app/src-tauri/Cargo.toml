[package]
name = "keyisland"
version = "0.1.10"
description = "密岛 KeyIsland — 本地加密账密管理"
authors = ["KeyIsland"]
edition = "2021"
# 刻意不写 `rust-version`。
#
# 原来这里是从 Tauri 模板抄来的 `1.77.2`，但 tauri 2.12 依赖 getrandom 0.3、
# windows 0.62，真实 MSRV 远高于此。写一个偏低的假数字比不写更危险：
# 一旦开了 MSRV 感知解析（`resolver.incompatible-rust-versions`），cargo 会为了
# 迁就这个数字把 tauri 降级到 2.0.x——而代码是按 2.12 的 API 写的。
# 不写，则各依赖用它们自己声明的 MSRV，由实际工具链决定能否构建。

[lib]
name = "keyisland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`：系统托盘用的是 Tauri 2 **内置**的 `tauri::tray`（`TrayIconBuilder`）
#   与 `tauri::menu`，所以这里只是打开 feature，**没有新增任何 crate 声明**，
#   也没有引入第三方托盘插件（社区插件只是内置 API 的再包装，多一层就多一处
#   会和会话状态不同步的地方）。
#
# 刻意**不开** `image-png`：托盘图标用 `app.default_window_icon()`（与安装包图标
# 天然一致，CHG-03），不需要 PNG 解码器。开了它会拖进 `image` 整棵依赖树，而
# 收益为零。将来若改成 `Image::from_bytes(include_bytes!("../icons/32x32.png"))`，
# 再把这个 feature 加上。
tauri = { version = "2", features = ["tray-icon"] }
# 单实例：双击两次图标不能再开第二个窗口。两个实例各自持有一个会话、
# 各自把整块 items 写回数据库，后写的会覆盖先写的——静默丢数据。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 存储：SQLite 存密文，AES-256-GCM 做应用层加密。
# 刻意不用 bundled-sqlcipher：它在 Windows 上要拖 openssl-src（perl + nasm），
# 构建链脆弱；改成"SQLite 存密文 + RustCrypto 加密每个值"，
# 安全性等价（每个值独立 nonce，AAD 绑定键名防挪移），依赖全是纯 Rust。
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# 数据库密钥存 Windows 凭据管理器（底层就是 DPAPI，按当前用户绑定）。
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# 开机自启：直接读写 HKCU\...\Run，不引入 tauri-plugin-autostart。
# winreg 本来就在依赖树里（tauri 的传递依赖），声明为直接依赖不增加任何下载。
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
